name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Validate version
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content Reepax/Reepax.csproj
          $version = [string]($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if ($env:BUILD_REF.StartsWith('refs/tags/')) {
            if ($env:BUILD_TAG -notmatch '^v(\d{2}\.(?:[1-9]|1[0-2])\.\d{1,4}(?:\.\d{1,4})?)$') { throw 'Invalid release tag.' }
            if ($Matches[1] -ne $version) { throw 'Release tag and project version differ.' }
          }
          if ($version -notmatch '^\d{2}\.(?:[1-9]|1[0-2])\.\d{1,4}(?:\.\d{1,4})?$') { throw 'Invalid application version.' }
          $assemblyVersion = if ($version.Split('.').Count -eq 3) { "$version.0" } else { $version }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "ASSEMBLY_VERSION=$assemblyVersion" >> $env:GITHUB_ENV
      - name: Check native test dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('Reepax/reepax_adblock.dll', 'Reepax/runtimes/win-x64/native/reepax_adblock.dll', 'Reepax/runtimes/win-x64/native/par2.exe')) {
            if (-not (Test-Path -LiteralPath $file)) { throw 'A native dependency is missing.' }
          }
          $runtimeRoot = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft/EdgeWebView/Application'
          if (-not (Get-ChildItem "$runtimeRoot/*/msedgewebview2.exe" -ErrorAction SilentlyContinue)) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'browser-runtime.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
            if ((Get-AuthenticodeSignature $bootstrapper).Status -ne 'Valid') { throw 'Browser runtime signature is invalid.' }
            $process = Start-Process $bootstrapper -ArgumentList '/silent /install' -PassThru -Wait -WindowStyle Hidden
            if ($process.ExitCode -ne 0 -or -not (Get-ChildItem "$runtimeRoot/*/msedgewebview2.exe" -ErrorAction SilentlyContinue)) { throw 'Browser runtime is unavailable.' }
          }
      - name: Run all tests
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test Reepax.slnx -c Release --logger 'trx;LogFileName=tests.trx' --results-directory TestResults --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$report = Get-Content TestResults/tests.trx
          $counts = $report.TestRun.ResultSummary.Counters
          if ([int]$counts.total -eq 0 -or [int]$counts.executed -ne [int]$counts.total -or [int]$counts.passed -ne [int]$counts.total) { throw 'Every test must execute and pass.' }
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
      - name: Publish application
        run: |
          dotnet publish Reepax/Reepax.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:AssemblyVersion=$env:ASSEMBLY_VERSION -p:FileVersion=$env:ASSEMBLY_VERSION -o dist/Reepax
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @('Reepax.exe', 'Reepax.dll', 'Reepax.deps.json', 'Reepax.runtimeconfig.json', 'runtimes/win-x64/native/WebView2Loader.dll', 'runtimes/win-x64/native/reepax_adblock.dll', 'runtimes/win-x64/native/par2.exe')) {
            if (-not (Test-Path -LiteralPath "dist/Reepax/$file")) { throw 'Published payload is incomplete.' }
          }
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path 'dist/Reepax/Reepax.exe')).ProductVersion.Split('+')[0]
          if ($version -ne $env:APP_VERSION) { throw 'Published binary has an unexpected version.' }
      - name: Retrieve previous package for delta generation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist/updates -Force | Out-Null
          $json = gh api "repos/$env:GH_REPO/releases?per_page=50"
          if ($LASTEXITCODE -ne 0) { throw 'The previous release could not be checked.' }
          $previous = $json | ConvertFrom-Json | Where-Object { -not $_.draft -and -not $_.prerelease } |
            Sort-Object published_at -Descending | Select-Object -First 1
          if (-not $previous) { return }
          $previousVersion = $null
          if (-not [Version]::TryParse($previous.tag_name.TrimStart('v'), [ref]$previousVersion) -or
              $previousVersion -ge [Version]$env:APP_VERSION) { return }
          $packages = @($previous.assets | Where-Object name -Match '^Reepax\.Desktop-[0-9][a-zA-Z0-9.\-]*-full\.nupkg$')
          if ($packages.Count -gt 1) { throw 'The previous full package is ambiguous.' }
          if ($packages.Count -eq 1) {
            $asset = $packages[0]
            gh release download $previous.tag_name --pattern $asset.name --dir dist/updates
            if ($LASTEXITCODE -ne 0) { throw 'The previous full package could not be downloaded.' }
            $file = Join-Path dist/updates $asset.name
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.digest -ne "sha256:$hash" -or $asset.size -ne (Get-Item -LiteralPath $file).Length) { throw 'The previous package failed verification.' }
          }
      - name: Build update packages and compatible installer payload
        run: ./.github/scripts/Build-UpdatePackages.ps1 -Version $env:APP_VERSION
      - name: Install packaging compiler
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer
        run: |
          $compiler = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6/ISCC.exe'
          & $compiler "/DMyAppVersion=$env:APP_VERSION" installer/Reepax.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item dist/setup.exe).Length -lt 1000000) { throw 'Installer is incomplete.' }
      - name: Verify installation and startup
        run: |
          $compiler = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6/ISCC.exe'
          ./.github/scripts/Test-Installer.ps1 -Compiler $compiler -Version $env:APP_VERSION -TemporaryRoot $env:RUNNER_TEMP
      - name: Generate checksums
        id: release_assets
        run: |
          $packagePrefix = "dist/updates/Reepax.Desktop-$env:VELOPACK_PACKAGE_VERSION"
          $files = @(
            'dist/setup.exe'
            'dist/updates/releases.win.json'
            "dist/updates/Reepax.Desktop-$env:APP_VERSION-files.json"
            "$packagePrefix-full.nupkg"
          )
          $delta = "$packagePrefix-delta.nupkg"
          if (Test-Path -LiteralPath $delta -PathType Leaf) { $files += $delta }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
          (@('paths<<EOF') + $files + @('dist/SHA256SUMS.txt', 'EOF')) >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: ${{ steps.release_assets.outputs.paths }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Upload and verify draft before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $json = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($json | ConvertFrom-Json).isDraft) { throw 'An already published release will not be modified.' }
          } else {
            gh release create $env:RELEASE_TAG --draft --verify-tag --generate-notes --title $env:RELEASE_TAG
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $files = @(Get-ChildItem dist -File -Recurse)
          if (@($files | Group-Object Name | Where-Object Count -GT 1).Count -ne 0) { throw 'Duplicate release asset names.' }
          $assetPaths = @($files.FullName)
          gh release upload $env:RELEASE_TAG @assetPaths --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Draft releases are available through the release list, not the published-tag endpoint.
          $json = gh api "repos/$env:GH_REPO/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $matchingReleases = @(($json | ConvertFrom-Json) | Where-Object tag_name -CEQ $env:RELEASE_TAG)
          if ($matchingReleases.Count -ne 1) { throw 'The release draft could not be resolved uniquely.' }
          $release = $matchingReleases[0]
          if (-not $release.draft -or $release.prerelease) { throw 'Unexpected release state.' }
          foreach ($file in $files) {
            $name = $file.Name
            $assets = @($release.assets | Where-Object name -CEQ $name)
            if ($assets.Count -ne 1 -or $assets[0].state -ne 'uploaded' -or $assets[0].size -ne $file.Length) { throw 'Uploaded release is incomplete.' }
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($assets[0].digest -ne "sha256:$hash") { throw 'Uploaded asset digest differs.' }
          }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

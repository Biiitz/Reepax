name: "Build & Release Reepax"

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: "Build & Release"
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Determine Application Version
        id: version_step
        shell: powershell
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $version = $tag.TrimStart('v', 'V')
          if (-not $version -or $version -match '^main$|^master$') {
              [xml]$xml = Get-Content Reepax\Reepax.csproj
              $version = ($xml.Project.PropertyGroup.Version | Where-Object { $_ -match '\S' } | Select-Object -First 1)
              if (-not $version) { $version = "26.10.2" }
              $version = $version.Trim()
          }
          $releaseTag = if ($tag -and $tag -notmatch '^main$|^master$') { $tag } else { "v$version" }
          if (-not $releaseTag.StartsWith('v', [System.StringComparison]::OrdinalIgnoreCase)) {
              $releaseTag = "v$releaseTag"
          }

          $parts = $version.Split('.')
          $assemblyVer = if ($parts.Count -eq 3) { "$version.0" } elseif ($parts.Count -eq 2) { "$version.0.0" } elseif ($parts.Count -eq 1) { "$version.0.0.0" } else { $version }

          Write-Host "Resolved Version: $version"
          Write-Host "Resolved AssemblyVersion: $assemblyVer"
          Write-Host "Resolved ReleaseTag: $releaseTag"

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ASSEMBLY_VERSION=$assemblyVer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "assembly_version=$assemblyVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Solution (Release Configuration)
        shell: powershell
        run: |
          Write-Host "Building solution in Release configuration..."
          dotnet build Reepax.slnx -c Release --verbosity normal

      - name: Publish Self-Contained Application
        shell: powershell
        run: |
          Write-Host "Publishing Reepax with Version: $env:APP_VERSION"
          if (Test-Path dist\Reepax) {
              Remove-Item -Recurse -Force dist\Reepax -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Force -Path dist\Reepax | Out-Null
          dotnet publish Reepax\Reepax.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:AssemblyVersion=$env:ASSEMBLY_VERSION -p:FileVersion=$env:ASSEMBLY_VERSION -o dist\Reepax

      - name: "Verify Published Binary & Dependencies"
        shell: powershell
        run: |
          $exePath = "dist\Reepax\Reepax.exe"
          if (-not (Test-Path $exePath)) {
              Write-Error "CRITICAL: dist\Reepax\Reepax.exe does not exist!"
              exit 1
          }

          $exeSize = (Get-Item $exePath).Length
          Write-Host "Reepax.exe Size: $exeSize bytes"
          if ($exeSize -lt 100000) {
              Write-Error "CRITICAL: dist\Reepax\Reepax.exe is unexpectedly small ($exeSize bytes)!"
              exit 1
          }

          # Check essential runtime and configuration files
          $criticalFiles = @(
              "dist\Reepax\Reepax.dll",
              "dist\Reepax\Reepax.deps.json",
              "dist\Reepax\Reepax.runtimeconfig.json"
          )
          foreach ($file in $criticalFiles) {
              if (-not (Test-Path $file)) {
                  Write-Error "CRITICAL: Required runtime file '$file' is missing from published payload!"
                  exit 1
              }
          }

          # Validate executable version metadata
          $vi = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exePath))
          Write-Host "Reepax.exe FileVersion: $($vi.FileVersion), ProductVersion: $($vi.ProductVersion)"
          if (-not $vi.ProductVersion) {
              Write-Error "CRITICAL: Reepax.exe ProductVersion is missing or empty!"
              exit 1
          }

          Write-Host "Published binary and runtime integrity verified successfully."

      - name: Create Portable Archive (portable.zip)
        shell: powershell
        run: |
          New-Item -ItemType File -Force -Path "dist\Reepax\portable.txt" -Value "Reepax Portable Mode" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist\Reepax\Data" | Out-Null

          Compress-Archive -Path "dist\Reepax\*" -DestinationPath "dist\portable.zip" -CompressionLevel Optimal -Force
          $zipItem = Get-Item "dist\portable.zip"
          Write-Host "portable.zip created ($($zipItem.Length) bytes)"

          # Test extracting the archive to verify it is not corrupted
          $testExtractDir = "dist\test_verify_archive"
          New-Item -ItemType Directory -Force -Path $testExtractDir | Out-Null
          Expand-Archive -Path "dist\portable.zip" -DestinationPath $testExtractDir -Force
          if (-not (Test-Path "$testExtractDir\Reepax.exe")) {
              Write-Error "CRITICAL: portable.zip verification failed - Reepax.exe not found in extracted archive!"
              exit 1
          }
          if (-not (Test-Path "$testExtractDir\portable.txt")) {
              Write-Error "CRITICAL: portable.zip verification failed - portable.txt not found in extracted archive!"
              exit 1
          }
          Remove-Item -Recurse -Force $testExtractDir
          Write-Host "portable.zip archive extraction verified successfully."

          # Clean up portable markers so Inno Setup installer will not package them
          Remove-Item -Force "dist\Reepax\portable.txt" -ErrorAction SilentlyContinue
          if (Test-Path "dist\Reepax\Data") {
              Remove-Item -Recurse -Force "dist\Reepax\Data" -ErrorAction SilentlyContinue
          }

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Build Setup Installer (setup.exe)
        shell: powershell
        run: |
          $isccCandidates = @(
              "iscc.exe",
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
              "C:\ProgramData\chocolatey\bin\iscc.exe"
          )
          $iscc = $null
          foreach ($cand in $isccCandidates) {
              if (Get-Command $cand -ErrorAction SilentlyContinue) {
                  $iscc = $cand
                  break
              } elseif (Test-Path $cand) {
                  $iscc = $cand
                  break
              }
          }

          if ($iscc) {
              Write-Host "Compiling setup.exe with $iscc for Version: $env:APP_VERSION..."
              & $iscc "/DMyAppVersion=$env:APP_VERSION" installer\Reepax.iss
              if (Test-Path dist\Reepax-Setup.exe) {
                  Copy-Item dist\Reepax-Setup.exe dist\setup.exe -Force
              }
              if (Test-Path dist\setup.exe) {
                  Get-Item "dist\setup.exe" | Select-Object Name, Length
              } else {
                  Write-Error "dist\setup.exe was not created!"
                  exit 1
              }
          } else {
              Write-Error "Inno Setup Compiler (ISCC.exe) not found!"
              exit 1
          }

      - name: Verify Setup Installer Integrity
        shell: powershell
        run: |
          $setupPath = "dist\setup.exe"
          if (-not (Test-Path $setupPath)) {
              Write-Error "CRITICAL: dist\setup.exe was not created!"
              exit 1
          }
          $setupSize = (Get-Item $setupPath).Length
          Write-Host "setup.exe Size: $setupSize bytes"
          if ($setupSize -lt 1000000) {
              Write-Error "CRITICAL: dist\setup.exe is unexpectedly small ($setupSize bytes)!"
              exit 1
          }
          Write-Host "setup.exe installer integrity verified successfully."

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: Reepax-Release-Files
          path: |
            dist/portable.zip
            dist/setup.exe

      - name: Attach Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.event.release.tag_name || steps.version_step.outputs.release_tag }}
          files: |
            dist/portable.zip
            dist/setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}